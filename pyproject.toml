[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "homomorphic-genomic-gwas-engine"
version = "2.0.0"
description = "FHE-GWAS: Fully Homomorphic Encrypted Genome-Wide Association Study Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
homomorphic-genomic-gwas-engine = "fhe_gwas_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/homomorphic-genomic-gwas-engine"
Repository = "https://github.com/abusuraihsakhri/homomorphic-genomic-gwas-engine.git"
