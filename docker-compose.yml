version: '3.8'

services:
  homomorphic-genomic-gwas-engine:
    build: .
    container_name: homomorphic-genomic-gwas-engine
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=${AUDIT_SECRET_KEY:-please-override-in-production-env-file}
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
