[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "homomorphic-genomic-gwas-agent"
version = "2.0.0"
description = "FHE-GWAS: Fully Homomorphic Encrypted Genome-Wide Association Study Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
server = ["fastapi>=0.100,<1", "uvicorn>=0.24,<1"]
dev = ["pytest>=8,<10", "httpx>=0.24,<1"]

[project.scripts]
homomorphic-genomic-gwas-engine = "fhe_gwas_agent.cli:main"
homomorphic-genomic-gwas-agent = "cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/homomorphic-genomic-gwas-agent"
Repository = "https://github.com/abusuraihsakhri/homomorphic-genomic-gwas-agent.git"
